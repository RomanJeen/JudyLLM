<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Judy · Live office</title>
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem("judy-theme") || "light"; } catch (e) {}
  </script>
  <link rel="icon" href="/judy-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/judy-theme.css" />
  <link rel="stylesheet" href="/judy-live.css" />
</head>
<body>
  <header class="topbar live-top">
    <a class="brand" href="/">
      <img class="brand-mark" src="/judy-mark.svg" width="32" height="32" alt="" aria-hidden="true" />
      <span>
        <span class="brand-word">Judy</span>
        <span class="brand-sub">Live office</span>
      </span>
    </a>
    <span class="sys" role="status"><span class="led" id="statusLed"></span><span id="statusText">Connecting</span></span>
    <span class="topbar-spacer"></span>
    <div class="live-controls">
      <label class="visually-label" for="modeSelect" hidden>Source</label>
      <select id="modeSelect" aria-label="Watch a live run or replay a past run">
        <option value="live">Live run</option>
      </select>
      <div class="seg-speed hidden" id="speedSeg" role="group" aria-label="Replay speed">
        <button type="button" data-speed="1" aria-pressed="false">1x</button>
        <button type="button" data-speed="4" aria-pressed="true">4x</button>
        <button type="button" data-speed="16" aria-pressed="false">16x</button>
      </div>
      <button type="button" class="btn btn-sm hidden" id="playBtn" aria-label="Pause"><span data-icon="stop"></span><span id="playLabel">Pause</span></button>
      <button type="button" class="btn btn-sm hidden" id="restartBtn"><span data-icon="refresh"></span>Restart</button>
      <button type="button" class="btn btn-sm btn-danger hidden" id="stopBtn"><span data-icon="stop"></span>Stop run</button>
      <button type="button" class="btn btn-sm" id="fsBtn"><span data-icon="expand"></span>Fullscreen</button>
      <button type="button" class="btn btn-sm" id="themeBtn"></button>
      <a class="btn btn-sm" href="/"><span data-icon="arrow-left"></span>Console</a>
    </div>
  </header>

  <section class="hud" id="hud" aria-label="Run progress">
    <div class="hud-progress">
      <span class="num" id="hudDone">0</span>
      <span class="of">of <span id="hudTotal">0</span> questions judged</span>
    </div>
    <div class="hud-bar" aria-hidden="true">
      <i class="b-ok" id="barOk"></i><i class="b-partial" id="barPartial"></i><i class="b-false" id="barFalse"></i><i class="b-error" id="barError"></i>
    </div>
    <div class="hud-counts">
      <span class="pill ok">OK <b id="cntOk">0</b></span>
      <span class="pill partial">PARTIAL <b id="cntPartial">0</b></span>
      <span class="pill false">FALSE <b id="cntFalse">0</b></span>
      <span class="pill error">ERROR <b id="cntError">0</b></span>
    </div>
    <div class="hud-meta">
      <span><span class="k">Agent</span> <strong id="hudTarget">—</strong></span>
      <span><span class="k">Judges</span> <strong id="hudJudges">—</strong></span>
      <span><span class="k">Elapsed</span> <span class="mono" id="hudElapsed">0s</span></span>
    </div>
  </section>

  <main class="stage-wrap" id="stageWrap">
    <div id="stage" class="stage" role="img" aria-label="3D office: judges carry answers between the tested agent and their desks"></div>
    <div class="stage-empty" id="stageEmpty"><span id="stageEmptyText">Waiting for a run. Start one in the console, or pick a past run above to replay it.</span></div>
    <div class="stage-loading" id="stageLoading" role="status">
      <div class="loading-card">
        <img src="/judy-mark.svg" width="40" height="40" alt="" aria-hidden="true" />
        <span class="loading-text">Setting up the office</span>
        <span class="loading-bar"><i id="stageLoadingBar"></i></span>
      </div>
    </div>
    <button type="button" class="btn btn-sm view-reset" id="resetViewBtn" title="Drag to look around, scroll to zoom"><span data-icon="refresh"></span>Reset view</button>
    <div class="legend" aria-hidden="true">
      <span><span class="led ok"></span>OK</span>
      <span><span class="led partial"></span>PARTIAL</span>
      <span><span class="led false"></span>FALSE</span>
      <span><span class="led error"></span>ERROR</span>
    </div>
    <div class="tip" id="tip" role="tooltip"></div>

    <aside class="drawer" id="drawer" aria-label="Question details" aria-hidden="true">
      <div class="drawer-head">
        <span class="qnum" id="drawerNum">#</span>
        <span id="drawerPill"></span>
        <span class="spacer"></span>
        <button type="button" class="btn btn-sm btn-icon btn-ghost" id="drawerClose" aria-label="Close details"><span data-icon="chevron-right"></span></button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
      <div class="drawer-foot">
        <a class="btn btn-sm" id="drawerReport" href="/report" target="_blank" rel="noopener"><span data-icon="external"></span>Open report</a>
      </div>
    </aside>
  </main>

  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }
  </script>
  <script src="/vendor/gsap.min.js"></script>
  <script src="/judy-ui.js"></script>
  <script src="/judy-live.js"></script>
  <script type="module">
    import("/judy-live-3d.mjs")
      .then((m) => window.JudyLive.boot(m.createScene))
      .catch((err) => {
        console.error(err);
        const text = document.getElementById("stageEmptyText");
        if (text) text.textContent = "The 3D office failed to load: " + (err && err.message ? err.message : err);
        const loading = document.getElementById("stageLoading");
        if (loading) loading.remove();
      });
  </script>
</body>
</html>
